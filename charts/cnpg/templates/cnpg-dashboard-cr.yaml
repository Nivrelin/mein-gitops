apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cnpg-main-dashboard
  namespace: cnpg-cluster-test
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: https://raw.githubusercontent.com/Nivrelin/mein-gitops/main/charts/cnpg/files/cnpg-dashboard.json
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-cnpg-read-binding
  namespace: cnpg-cluster-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role # Case-sensitive!
  name: grafana-sidecar-role
subjects:
  - kind: ServiceAccount
    name: grafana-monitoring-sa
    namespace: monitoring-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-sidecar-role
rules:
- apiGroups: [""]
  resources: ["GrafanaDashboard", "GrafanaDatasource"]
  verbs: ["get", "list", "watch"]