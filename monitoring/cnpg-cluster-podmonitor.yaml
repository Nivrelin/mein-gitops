apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster-monitor
  namespace: cnpg-cluster-test
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: mein-postgres-cluster
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
