cluster:
  name: "green-cluster-v18" # Neuer Name für Blue-Green
  imageName: "ghcr.io/cloudnative-pg/postgresql:18"
  instances: 3
  storageSize: "1Gi"
  storageClass: "crc-csi-hostpath-provisioner"
  
  # Blue-Green Logik (Ziel: der v13 Cluster im selben Namespace)
  bootstrapFrom: "legacy-upgrade-test" # Name des alten Clusters
  replicaEnabled: true
  externalClusters:
    - name: "legacy-upgrade-test"
      connectionParameters:
        host: "legacy-upgrade-test-rw.cnpg-cluster-test-legacy.svc.cluster.local"
        user: "postgres"
      password:
        name: "legacy-upgrade-test-superuser"
        key: "password"