# WICHTIG: Die Variable heißt jetzt "clusters" (Plural) und ist eine Liste
clusters:
  # Dein bestehender v13 Cluster (Blau)
  - name: "legacy-upgrade-test"
    imageName: "ghcr.io/cloudnative-pg/postgresql:13"
    instances: 3
    managed:
      name: "app"
      login: true
      replication: true
    
  # Dein neuer v18 Cluster (Grün)
  - name: "green-cluster-v18"
    imageName: "ghcr.io/cloudnative-pg/postgresql:18"
    instances: 3
        
    # Blue-Green Verbindungsinformationen
    bootstrapFrom: "legacy-upgrade-test"
    replicaEnabled: true

monitoring:
  releaseLabel: prometheus

# Falls du Pooler oder Grafana nutzt, müssten diese Templates ebenfalls 
# in Schleifen gepackt werden, oder du lässt sie erst mal deaktiviert:
pooler:
  enabled: false
grafana:
  enabled: false