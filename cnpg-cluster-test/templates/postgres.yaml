{{- range .Values.clusters }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .name }}
spec:
  # Nutzt das Image pro Cluster, Standard ist 16 falls nicht definiert
  imageName: {{ .imageName | default "ghcr.io/cloudnative-pg/postgresql:18" }}
  instances: {{ .instances | default 3 }}

  postgresql:
    pg_hba:
      - host replication app all md5
  bootstrap:  
    {{- if not .bootstrapFrom}}
  # Bootstrap & External Clusters (nur wenn bootstrapFrom definiert ist)
    initdb:
      database: app
      owner: app
      postInitApplicationSQL:
        - CREATE TABLE n (i SERIAL PRIMARY KEY, m INTEGER)
        - INSERT INTO n (m) (SELECT generate_series(1,10000))
        - ALTER TABLE n OWNER TO app
    {{- else}}
    pg_basebackup:
      source: {{ .bootstrapFrom }}
    {{- end}}
  {{- if .managed }} 
  managed:
    roles:
      - name: {{ .rolename }}
        login: {{ .rolelogin | default false}}
        replication: {{ .replication | default false }}
  {{- end}}
  {{- if .bootstrapFrom }}
  externalClusters:
    - name: {{ .bootstrapFrom }}
      connectionParameters:
        # Wir gehen davon aus, dass der Quell-Cluster im gleichen Namespace liegt
        host: {{ printf "%s-rw.%s.svc.cluster.local" .bootstrapFrom $.Release.Namespace }}
        user: app       
      password:
        name: {{ printf "%s-app" .bootstrapFrom }}
        key: password

  replica:
    enabled: {{ if (hasKey . "replicaEnabled") }}{{ .replicaEnabled }}{{ else }}true{{ end }}
    source: {{ .bootstrapFrom }}
  {{- end }}

  storage:
    size: {{ .storageSize | default "1Gi" }}
    storageClass: {{ .storageClass | default "crc-csi-hostpath-provisioner" }}
  
  monitoring:
    enablePodMonitor: true
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .name }}-monitor
  labels:
    release: {{ $.Values.monitoring.releaseLabel | default "prometheus" }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .name }}
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
---
{{- if .publisher}}
apiVersion: postgresql.cnpg.io/v1
kind: Publication
metadata:
  name:  {{ .name}}-publisher
spec:
  cluster:
    name: {{ .name}}
  dbname: app
  name: publisher
  target:
    allTables: true
---
{{- end }}
{{- end }}