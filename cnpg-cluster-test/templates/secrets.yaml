{{- range .Values.clusters }}
{{- if not .bootstrapFrom }}
# Nur für den primären v13 Cluster (der kein Replica ist)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-superuser
  labels:
    cnpg.io/cluster: {{ .name }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ randAlphaNum 16 | quote }}
{{- end }}
{{- end }}