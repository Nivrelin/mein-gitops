{{- range .Values.clusters }}
{{- if not .bootstrapFrom }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-superuser
  labels:
    cnpg.io/cluster: {{ .name }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  # Nur generieren, wenn es noch nicht existiert (Idempotenz)
  {{- $secret := (lookup "v1" "Secret" $.Release.Namespace (printf "%s-superuser" .name)) }}
  {{- if $secret }}
  password: {{ index $secret.data "password" | b64dec | quote }}
  {{- else }}
  password: {{ randAlphaNum 16 | quote }}
  {{- end }}
{{- end }}
{{- end }}