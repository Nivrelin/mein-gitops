apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-default-dashboard
  labels:
    grafana_dashboard: "1"
data:
  cnpg-dashboard.json: |-
{{ .Files.Get "files/cnpg-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana-sa
      containers:
      - name: grafana
        image: {{ .Values.grafana.image }}
        env:
        - name: PROMETHEUS_URL
          value: {{ .Values.grafana.prometheusUrl }}
# ... hier den Rest deiner grafana-setup.yaml einfügen (Volumes, Ports etc.)