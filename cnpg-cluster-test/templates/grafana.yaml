apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-default-dashboard
  labels:
    grafana_dashboard: "1"
data:
  cnpg-dashboard.json: |-
{{ .Files.Get "files/cnpg-dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana-sa
      containers:
      - name: grafana
        image: {{ .Values.grafana.image | default "grafana/grafana:latest" }}
        ports:
        - name: web
          containerPort: 3000
        env:
        - name: PROMETHEUS_URL
          value: {{ .Values.grafana.prometheusUrl }}
        # Das TOKEN gehört hier in den env-Bereich, NICHT unter ports!
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-sa-token
              key: token
              optional: true
        volumeMounts:
        - name: datasource-config
          mountPath: /etc/grafana/provisioning/datasources
        - name: sc-dashboard-volume
          mountPath: /tmp/dashboards
      volumes:
      - name: datasource-config
        configMap:
          name: grafana-datasources
      - name: sc-dashboard-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: 3000
  tls:
    termination: edge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-sa-token
  annotations:
    kubernetes.io/service-account.name: grafana-sa
type: kubernetes.io/service-account-token