{{- if .Values.pooler.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.cluster.name }}-pooler-monitor
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: {{ .Values.cluster.name }}-pooler
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
{{- end }}