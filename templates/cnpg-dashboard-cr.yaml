apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cnpg-main-dashboard
  namespace: cnpg-cluster-test
  labels:
    dashboards: grafana # <--- Das muss zum Selector der Instanz oben passen!
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
        dashboards: "grafana"
  url: https://raw.githubusercontent.com/Nivrelin/mein-gitops/main/files/cnpg-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: cnpg-datasource
  namespace: cnpg-cluster-test
spec:
    instanceSelector:
        matchLabels:
            dashboards: "grafana"
    allowCrossNamespaceImport: true
    datasource:
        name: OpenShift-Prometheus
        type: prometheus
        access: proxy
        url: "https://thanos-querier.openshift-monitoring.svc:9091"
        isDefault: true
        jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true
        database: prometheus
            
