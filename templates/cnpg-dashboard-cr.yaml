apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cnpg-main-dashboard
  namespace: cnpg-cluster-test
  labels:
    dashboards: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  url: https://raw.githubusercontent.com/Nivrelin/mein-gitops/main/files/cnpg-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: cnpg-datasource
  namespace: cnpg-cluster-test
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  datasource:
    name: OpenShift-Prometheus
    type: prometheus
    access: proxy
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
    isDefault: true
    jsonData:
      httpHeaderName1: 'Authorization'
      tlsSkipVerify: true     
      forwardOauthIdentity: false
    secureJsonData:
      httpHeaderValue1: 'Bearer ${TOKEN}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-cnpg-read-binding
  namespace: cnpg-cluster-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole # Case-sensitive!
  name: view
subjects:
  - kind: ServiceAccount
    name: grafana-monitoring-sa
    namespace: monitoring-system