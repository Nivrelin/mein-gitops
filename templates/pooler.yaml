{{- range .Values.clusters }}
{{- if .Values.pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.clusters.name }}-pooler
spec:
  cluster:
    name: {{ .Values.clusters.name }}
  instances: {{ .Values.pooler.instances }}
  type: {{ .Values.pooler.type }}
  pgbouncer:
    poolMode: {{ .Values.pooler.poolMode }}
    # Die Pool-Größe gehört in die parameters-Sektion
    parameters:
      default_pool_size: {{ .Values.pooler.poolSize | quote }}
{{- end }}
{{- end }}