{{- range .Values.clusters }}
{{- if .pooler.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .name }}-pooler
spec:
  cluster:
    name: {{ .name }}
  instances: {{ .pooler.instances }}
  type: {{ .pooler.type }}
  pgbouncer:
    poolMode: {{ .pooler.poolMode }}
    # Die Pool-Größe gehört in die parameters-Sektion
    parameters:
      default_pool_size: {{ .pooler.poolSize | quote }}
---
{{- if .pooler.monitoring }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .name }}-pooler-monitor
spec:
  selector:
    matchLabels:
      cnpg.io/poolerName: {{ .name }}-pooler
  podMetricsEndpoints:
  - port: metrics
    interval: 30s
{{- end }}
{{- end }}
{{- end }}