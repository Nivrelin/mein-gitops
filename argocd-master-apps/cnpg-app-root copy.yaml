apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster-test-legacy
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: 'https://github.com/Nivrelin/mein-gitops.git'
    # Hier sagen wir ArgoCD, dass er im Branch "helm" suchen soll:
    targetRevision: main
    path: cnpg-cluster-test-legacy
    helm:
      valueFiles:
        - values-legacy.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cnpg-cluster-test-legacy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true