# --- HIER NEU: Generiert ein echtes Namespace-Manifest für jede App ---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
  labels:
    # Verknüpft den Namespace fest mit dieser Argo Application
    argocd.argoproj.io/instance: {{ .name }}
---
{{- $root := . -}}
{{- range .Values.applications }}
{{- if ne .enabled false }} {{/* Schaut ob enabled nicht false ist (wird aktiv wenn true oder weggelassen) */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .project | default "default" }}
  source:
    {{- if eq .type "github" }}
    repoURL: {{ cat "https://github.com/Nivrelin/" .repoName | nospace | quote }}
    path: {{ .path | default "." | quote }}
    {{- else }}
    repoURL: {{ .repoURL | quote }}
    chart: {{ .chart | quote }}
    {{- end }}
    targetRevision: {{ .targetRevision | default "HEAD" | quote }}
    {{- if or .valueFiles .inlineValues }}
    helm:
      {{- if .valueFiles }}
      valueFiles:
      {{- range .valueFiles }}
        - {{ . | quote }}
      {{- end }}
      {{- end }}
      
      {{- if .inlineValues }}
      values: |
{{ toYaml .inlineValues | indent 8 }}
      {{- end }}
    {{- end }}  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: {{ .namespace }}
  
  syncPolicy:
    automated:
      prune: {{ if and (hasKey . "sync") (hasKey .sync "automated") (hasKey .sync.automated "prune") }}{{ .sync.automated.prune }}{{ else }}true{{ end }}
      selfHeal: {{ if and (hasKey . "sync") (hasKey .sync "automated") (hasKey .sync.automated "selfHeal") }}{{ .sync.automated.selfHeal }}{{ else }}true{{ end }}
    syncOptions:
      {{- if and (hasKey . "sync") (hasKey .sync "syncOptions") }}
      {{- range .sync.syncOptions }}
        - {{ . | quote }}
      {{- end }}
      {{- else }}
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
      {{- end }}
---
{{- end }}
{{- end }}
